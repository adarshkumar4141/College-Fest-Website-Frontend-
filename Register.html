
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechFest 2027 - Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TechFest 2027</h1>
        <p>Innovate • Create • Celebrate</p>
    </header>


    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="schedule.html">Schedule</a>
        <a href="register.html">Registration</a>
        <a href="contact.html">Contact</a>
    </nav>

  
    <main>

        <section>
            <h2>Student Registration Form</h2>

            <p>
                Fill all the details below to register
                for TechFest 2027.
            </p>
        </section>

        <section>

            <form action="#" method="post">

              
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                    placeholder="Enter your full name" required>

                <br><br>

             
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter your email" required>

                <br><br>

               
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                    placeholder="Enter your phone number"required>

                <br><br>

               
                <label for="department">Department:</label>

                <select id="department" name="department" required>
                    <option value=>Select Department</option>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="B.Tech AI/ML">B.Tech AI/ML</option>
                    <option value="B.Tech CS/DS">B.Tech AI/DS</option>
                    <option value="BBA">BBA</option>
                    <option value="BCA">BCA</option>
                    <option value="Other">Other</option>
                </select>

                <br><br>

              
                <label for="year">Year of Study:</label>

                <select id="year" name="year" required>
                    <option value="">Select Year</option>
                    <option value="First Year">First Year</option>
                    <option value="Second Year">Second Year</option>
                    <option value="Third Year">Third Year</option>
                    <option value="Fourth Year">Fourth Year</option>
                </select>

                <br><br>

                <label>Gender:</label>

                <br>

                <input type="radio" id="male"
                    name="gender" value="Male" required>
                <label for="male">Male</label>

                <input type="radio" id="female"
                    name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="other"
                    name="gender" value="Other">
                <label for="other">Other</label>

                <br><br>

           
                <label>Choose Your Events:</label>

                <br>

                <input type="checkbox" id="code"
                    name="events" value="Code Sprint">
                <label for="code">Code Sprint</label>

                <br>

                <input type="checkbox" id="robo"
                    name="events" value="Robo Race">
                <label for="robo">Robo Race</label>

                <br>

                <input type="checkbox" id="quiz"
                    name="events" value="Tech Quiz">
                <label for="quiz">Tech Quiz</label>

                <br>

                <input type="checkbox" id="web"
                    name="events" value="Web Design Challenge">
                <label for="web">Web Design Challenge</label>

                <br>

                <input type="checkbox" id="expo"
                    name="events" value="Project Expo">
                <label for="expo">Project Expo</label>

                <br><br>

          
                <label for="address">Address / Additional Details:</label>

                <br>

                <textarea id="address" name="address"
                    rows="5" cols="40"
                    placeholder="Enter your address or additional details">
                </textarea>

                <br><br>

                <input type="checkbox" id="declaration"
                    name="declaration" required>

                <label for="declaration">
                    I confirm that the information provided by me is correct to my best knowledge.
                </label>

                <br><br>

              
                <button type="submit">Submit Registration</button>

                <button type="reset">Reset Form</button>

            </form>
        </section>
    </main>

    <footer>
        <p>© 2027 TechFest. All Rights Reserved.</p>
    </footer>

</body>
</html>
